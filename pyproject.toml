[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "discogstagger3"
version = "3.2.0"
description = "Console based audio-file metadata tagger that uses the Discogs.com API"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "sjbrownrigg" },
]
# Original upstream author, retained for attribution:
# { name = "Markus M. May", email = "triplem@javafreedom.org" }
requires-python = ">=3.10"

dependencies = [
    # Actively maintained fork of the official (now deprecated) discogs-client
    # See: https://github.com/joalla/discogs_client
    "python3-discogs-client>=2.8",
    "mediafile>=0.17",
    "mutagen>=1.47",
    "requests>=2.31",
    "mako>=1.3",
    "watchdog>=4.0",
    "chardet",
    "r128gain>=1.0",
    "rapidfuzz>=3.0",
    "pyyaml>=6.0",
    "Pillow>=10.0"
]

[project.optional-dependencies]
# OAuth support — only needed if you authenticate via OAuth rather than a user token.
# python3-discogs-client supports both; a simple user token (from your Discogs
# developer settings) is the easier path and doesn't require rauth.
oauth = [
    "rauth>=0.7",
]

# Development/test tooling
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    # Modern replacement for invoke 0.7 — or drop entirely in favour of a Makefile
    "invoke>=2.2",
]

[project.scripts]
# Installs `discogstagger` as a command on your PATH after `pip install -e .`
discogstagger = "discogstagger.__main__:main"

[project.urls]
Homepage = "https://github.com/sjbrownrigg/discogstagger3"
Repository = "https://github.com/sjbrownrigg/discogstagger3"

# ---------------------------------------------------------------------------
# Tool configuration — everything that used to live in separate config files
# can live here instead.
# ---------------------------------------------------------------------------

[tool.setuptools.packages.find]
# `include` is required, not cosmetic. In pyproject.toml this table
# defaults to namespaces = true, so discovery matches directories that
# have no __init__.py. Unbounded, `where = ["."]` therefore picked up
# conf, docker, docs, scripts, templates and test as top-level packages
# -- shipping a generic `test` and `conf` into site-packages -- and also
# matched build/lib/discogstagger as `build.lib.discogstagger`, copying
# the previous build back in one level deeper on each run
# (build/lib/build/lib/... growing by a level per build).
where = ["."]
include = ["discogstagger*"]

[tool.setuptools.package-data]
# Bundled defaults live inside the discogstagger/ package so they are
# correctly installed by pip and locatable via the module's __file__ path.
"discogstagger" = ["conf/config_sample.yaml", "conf/formats_sample.ini", "conf/format_codes.yaml",
                   "conf/char_substitutions.yaml", "conf/logger_default.conf",
                   "templates/*"]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["discogstagger"]
omit = ["test/*", "ext/*"]

[tool.coverage.report]
show_missing = true