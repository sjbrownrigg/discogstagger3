[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "discogstagger3"
version = "3.2.0"
description = "Console based audio-file metadata tagger that uses the Discogs.com API"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "sjbrownrigg" },
]
# Original upstream author, retained for attribution:
# { name = "Markus M. May", email = "triplem@javafreedom.org" }
requires-python = ">=3.10"

dependencies = [
    # Actively maintained fork of the official (now deprecated) discogs-client
    # See: https://github.com/joalla/discogs_client
    "python3-discogs-client>=2.8",
    "mediafile>=0.17",
    "mutagen>=1.47",
    "requests>=2.31",
    "mako>=1.3",
    "watchdog>=4.0",
    "chardet",
    "r128gain>=1.0",
    "rapidfuzz>=3.0",
    "pyyaml>=6.0",
    "Pillow>=10.0"
]

[project.optional-dependencies]
# OAuth support — only needed if you authenticate via OAuth rather than a user token.
# python3-discogs-client supports both; a simple user token (from your Discogs
# developer settings) is the easier path and doesn't require rauth.
oauth = [
    "rauth>=0.7",
]

# Development/test tooling
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    # Modern replacement for invoke 0.7 — or drop entirely in favour of a Makefile
    "invoke>=2.2",
]

[project.scripts]
# Installs `discogstagger` as a command on your PATH after `pip install -e .`
discogstagger = "discogstagger.__main__:main"

[project.urls]
Homepage = "https://github.com/sjbrownrigg/discogstagger3"
Repository = "https://github.com/sjbrownrigg/discogstagger3"

# ---------------------------------------------------------------------------
# Tool configuration — everything that used to live in separate config files
# can live here instead.
# ---------------------------------------------------------------------------

[tool.setuptools.packages.find]
# Automatically discovers the `discogstagger` package
where = ["."]

[tool.setuptools.package-data]
# Ship the built-in config and format string defaults with the package
"*" = ["conf/config.yaml", "conf/formats.ini", "conf/format_codes.yaml",
       "conf/char_substitutions.yaml", "conf/logger_default.conf",
       "templates/*"]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["discogstagger"]
omit = ["test/*", "ext/*"]

[tool.coverage.report]
show_missing = true