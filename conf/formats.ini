# discogstagger3 — file naming format strings
#
# Format strings use Foobar2000-style %variable% and $function() syntax.
# See docs/tagging_reference.md for the full variable and function reference.
#
# This file is intentionally kept in INI format: the $function()/%variable%
# syntax contains characters ($, %, \, ') that would require awkward quoting
# in YAML.  Everything else lives in conf/config.yaml.
#
# To use your own format strings, copy this file and reference the copy
# explicitly in your personal YAML config:
#
#   common:
#     formats_file: conf/my_formats.ini

[file-formatting]
# These are the default format strings.  Override them in your personal
# YAML config's companion formats file (e.g. myconfig_formats.ini).
# See docs/tagging_reference.md for the full variable and function reference.

nfo     = %ALBARTIST%-%ALBTITLE%.nfo
m3u     = %ALBARTIST%-%ALBTITLE%.m3u
dir     = %ALBARTIST%-%ALBTITLE%-(%CATNO%)-%YEAR%
song    = %TRACKNO%-%ARTIST%-%TITLE%%TYPE%
va_song = %TRACKNO%-%ARTIST%-%TITLE%%TYPE%
image   = image
discs   = %ALBTITLE%-disc%DISCNO%

# Here are some examples of more complex format stings 
# nfo = %ALBARTIST% - %ALBTITLE%.nfo
# m3u = %ALBARTIST% - %ALBTITLE%.m3u

# # ── Directory naming ──────────────────────────────────────────────────────────
# #
# # Pattern:
# #   Artist/[Year] Album (Edition) (CatNo) [FormatCode codec-quality-samplerate]
# #
# # Examples:
# #   Clan of Xymox/[2004] Darkest Hour [CD flac-lossless-44s]
# #   Stray/[2012] Holding On [DCD flac-lossless-44s]
# #   The Young Gods/[2012] The Young Gods (Deluxe Edition) [DCD flac-lossless-44s]
# #   Front 242/[1992] Masterhit [11xfile flac-lossless-44s]
# #   Various Artists/[2001] Megahits 2001 Die Erste (560 938-2) [DCD flac-lossless-44s]
# #
# dir = $if1($strcmp('%albumartist%', 'Various'),'Various Artists','%albumartist%')/[%year%] %album%$if1($strcmp('%edition%',''),'', ' \(%edition%\)')$if1($strcmp('%catno%',''),'', ' \(%catno%\)') [$if1($inarray('["File","Web"]','%format%'),'%trackcount%x','')%format_code% $lower('%codec%')-%quality%$if1($strcmp('%quality%','lossless'),$ifequal(%bitdepth%,24,'-24',''),'')-$substr('%samplerate%','','-3')$if1($strcmp('%channels%','stereo'),'s','%channels%')]

# # ── Track naming ──────────────────────────────────────────────────────────────
# #
# # Single-artist:   01 Title.flac
# # Various-artists: 01 Artist - Title.flac
# #
# song    = $num('%tracknumber%','2') $if1($strcmp('%artist%','%albumartist%'),'','%artist% - ')%title%%fileext%
# va_song = $num('%tracknumber%','2') $if1($strcmp('%artist%','%albumartist%'),'','%artist% - ')%title%%fileext%

