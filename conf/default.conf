# ── REFERENCE ONLY — NOT LOADED BY THE APPLICATION ───────────────────────────
# This file is superseded by conf/config.yaml and is kept here for reference.
# The application loads conf/config.yaml as its baseline; this file is ignored.
# ─────────────────────────────────────────────────────────────────────────────

[DEFAULT]

[common]
# common
# user-agent for use with discogs_client and picture download
user_agent=discogstagger/3.0 +https://github.com/sjbrownrigg/discogstagger

[details]
# details
# True/False : leaves a copy of the original audio files on disk, untouched after 
# tagging actions are complete.
keep_original=True

embed_coverart=True
# Front-cover download policy:
#   always          — always download and replace existing art (original behaviour)
#   prefer_existing — skip download if any local cover image already exists
#   prefer_larger   — download only when the Discogs image is larger than the
#                     existing local cover (file or embedded); falls back to
#                     downloading when Discogs dimensions are unknown
image_policy=prefer_larger

# Character substitution profile — applied to generated filenames.
# Profiles are defined in conf/char_substitutions.yaml.
# Built-in options: linux (default, no substitutions), macos, windows,
#                   unicode_to_ascii (uncomment entries in the YAML to enable)
# Set char_substitutions to override the YAML file path.
char_profile=linux
char_substitutions=conf/char_substitutions.yaml
format_codes=conf/format_codes.yaml
#
# What to replace filesystem-invalid characters with (rather than removing them):
#   path_sep_replacement   — replaces / (default: empty = remove)
#   control_replacement    — replaces control chars \x00-\x1f,\x7f (default: empty)
# Example: path_sep_replacement=- turns embedded slashes into hyphens.
path_sep_replacement=
control_replacement=

# Use style instead of the genre as the genre Meta-Tag in files (True)
use_style=False
# Keep the following metadata tags
keep_tags=freedb_id
# Use lowercase filenames
use_lower_filenames=True
# Use folder.jpg as the name for the first image (should be the default,
# since most of the client programs do recognize this)
use_folder_jpg=True
# string used to split the artists, genres and styles
join_artists=" & "
join_genres_and_styles=" & "
# should multi-disc album be splitted by the discs in the folder structure
split_discs_folder=False
# should multi-disc albums be named with the given extension (e.g. "discX")
# the number is always appended to the extension
split_discs=False
split_discs_extension=" (disc%DISNO%)"
copy_other_files=False
# done file
done_file=dt.done
# label to use for various-artists compilations in the albumartist tag
variousartists=Various
# download on cover images or all images?
download_only_cover=True

[file-formatting]
# file-formatting
# The following options define the directory and file naming conventions
# Available tag subsitutions are as follows
# %ALBTITLE% - album title
# %ALBARTIST% - album artist
# %TITLE% - Track Title
# %TRACKNO% - Track number
# %ARTIST% - Track Artist
# %YEAR% - Album Year
# %CATNO% - Album Catalog number
# %GENRE% - Album Genre (only the first one in the list)
# %STYLE% - Album Style (only the first one in the list)
# %GROUP% - Group Tag
# %TYPE% - writes the file extension.
# %LABEL% - Record Label
# %DISCNO% - Number of the disc (of interest in multi-disc albums)
nfo=%ALBARTIST%-%ALBTITLE%.nfo
m3u=%ALBARTIST%-%ALBTITLE%.m3u
dir=%ALBARTIST%-%ALBTITLE%-(%CATNO%)-%YEAR%
song=%TRACKNO%-%ARTIST%-%TITLE%%TYPE%
va_song=%TRACKNO%-%ARTIST%-%TITLE%%TYPE%
# NOTE: this is just the prefix for the images, the images
# will be names e.g. 00-image-01.jpg. If use_folder_jpg is true
# the first image will be called folder.jpg, if false, the first
# image will be called image-00.jpg using the following configuration
image=image
# if multi disc releases get split by discs, then the following property
# is used in the folder names. The number of the disc is always attached
# to the name
discs=%ALBTITLE%-disc%DISCNO%


# [media_description] removed — format type/prefix/suffix logic is now handled
# by conf/format_codes.yaml and the %format_code% variable.

[character_exceptions]
# file is applied **on top of** the YAML profile, so you can add individual tweaks without editing the YAML
# &=_and_

[batch]
# batch
# if no release id is given, the application checks if a file with the
# name id_file (in this case id.txt) is in the source directory,
# if it is there the id_tag is checked (discogs_id) and assigned to the
# release id
id_file=id.txt
# search discogs automatically using existing file metadata (no release id needed)
searchdiscogs=False
# maximum average per-track time difference (seconds) allowed when matching releases
tracklength_tolerance=5.0
# minimum average fuzzy title similarity (0-100) required for tier-2 matches
# (releases where Discogs has no duration data). Set to 0 to disable filtering.
title_similarity_threshold=60

[cue]
# cue_done_dir: subdirectory used to stash processed cue files so they are
# excluded from subsequent directory scans
cue_done_dir=.cue
parse_cue_files=False

[tags]
# Additional metadata values written to EVERY tagged file.
# Each key is a MediaFile attribute name; the value is written as-is.
# Leave a key empty to write nothing for that attribute.
# Example:  encoder=discogstagger3
encoder=

[suppress_tags]
# Tags listed here are NOT written to file metadata during
# tagging.  The Discogs data for those fields is still available to format
# strings (%year%, %catno%, etc.) for directory and file naming.
#
# A warning is logged at startup if a format string references a suppressed tag
# (because the value is used for naming but absent from the file's metadata).
#
# Use MediaFile attribute names — the same names you would use in [tags] above.
# Common candidates for suppression:
#
#   genres               — genre(s)
#   country              — release country
#   label                — record label
#   grouping             — styles (stored in the grouping field)
#   comments             — release/track notes
#   composer             — album artist stored as composer
#   catalognum           — catalogue number
#   discogs_release_url  — Discogs release URL
#   media                — media type (Vinyl, CD, …)
#   disctitle            — disc subtitle
#   comp                 — compilation flag
#
# Uncomment to suppress:
# genres
# country
# label
# grouping
# comments
# composer
# catalognum
# discogs_release_url
# media
# disctitle
# comp

[replaygain]
add_tags=True
# options: (recommended) r128gain (default, pip-installable, requires ffmpeg),
#          metaflac (requires flac package), loudgain (requires loudgain binary)
application=r128gain

[cache]
# Directory for caching Discogs API responses (JSON) and downloaded images.
# Releases are stored as <directory>/releases/<id>.json
# Images are stored as <directory>/images/<sha256_of_url>.jpg
# Leave empty to disable caching.
directory=

[source]
# source
# defines a mapping between the name of the source and the corresponding
# id tag in the media file, not: only discogs and local are used right now
discogs=discogs_id
amg=amg_id
local=discogs_id
# tag source (here we are right now using only discogs, thats the default one)
name=discogs

[discogs]
# Preferred auth: generate a personal access token at
# https://www.discogs.com/settings/developers and set it here
# (or export DISCOGS_USER_TOKEN in your shell).
# This is simpler than the OAuth flow below.
user_token=
skip_auth=False
# OAuth 1.0a — only needed if you are not using a personal access token.
# Tokens are cached in .token after the first PIN flow.
consumer_key=
consumer_secret=

[logging]
# logging
# available logging levels
# 10 = debug
# 20 = info
# 30 = warn
# 40 = error
# 50 = critical
level=20
config_file=conf/logger_default.conf

