name: discogstagger3

services:
  discogstagger:
    build:
      context: ..              # project root (local — switch to GitHub URL after merge)
      dockerfile: docker/Dockerfile
    image: discogstagger3:latest
    restart: unless-stopped
    volumes:
      - ${MUSIC_DIR:-/home/stewart/Music}:/music          # existing WSL2 mount
      - ${CONFIG_DIR:-../docker/config}:/config           # local config for testing; replace with NFS path in prod
      - cache:/cache                                       # local named volume
    environment:
      TZ: Europe/London
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  cache:
    driver: local
