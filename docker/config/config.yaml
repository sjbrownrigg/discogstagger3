# ─────────────────────────────────────────────────────────────────────────────
# discogstagger3 — Docker sample configuration
# ─────────────────────────────────────────────────────────────────────────────
#
# All paths are absolute container paths:
#   /music   → NFS volume  :/volume1/Music
#   /config  → NFS volume  :/volume1/shared/Docker/discogstagger/config
#   /cache   → local named volume (persists across container restarts)
#
# Before first launch:
#   1. Replace YOUR_USER_TOKEN below with your Discogs personal access token
#      (generate one at https://www.discogs.com/settings/developers)
#   2. Ensure /volume1/Music/incoming/ and /volume1/Music/sorted/ exist on the NAS

common:
  user_agent: "discogstagger/3.0 +https://github.com/sjbrownrigg/discogstagger3"
  formats_file: /config/formats.ini
  source_dir: /music/incoming
  dest_dir: /music/sorted
  watch_poll_interval: 30   # seconds — NFS-safe polling interval

details:
  keep_original: true
  embed_coverart: true
  image_policy: prefer_larger

  char_profile: windows
  char_substitutions: /config/char_substitutions.yaml
  format_codes: /config/format_codes.yaml

  path_sep_replacement: "-"
  control_replacement: ""

  keep_tags: freedb_id

  # Case transformation per format type
  case_dir:     preserve
  case_disc:    preserve
  case_song:    preserve
  case_va_song: preserve
  case_nfo:     preserve
  case_m3u:     preserve

  use_folder_jpg: true

  variousartists: "Various Artists"

  split_discs: true

  copy_other_files: true
  done_file: .done
  download_only_cover: false

batch:
  id_file: id.txt
  searchdiscogs: true
  tracklength_tolerance: 5.0
  title_similarity_threshold: 60

cue:
  cue_done_dir: .cue
  parse_cue_files: true

tags:
  encoder: ""

replaygain:
  add_tags: true
  application: r128gain

cache:
  directory: /cache

source:
  discogs: discogs_id
  amg:     amg_id
  local:   discogs_id
  name:    discogs

discogs:
  skip_auth: false
  user_token: YOUR_USER_TOKEN

logging:
  level: 20
  config_file: /config/logger_docker.conf
