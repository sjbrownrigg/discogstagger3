# ─────────────────────────────────────────────────────────────────────────────
# discogstagger3 — Docker sample format strings
# ─────────────────────────────────────────────────────────────────────────────
#
# Loaded via formats_file: /config/formats.ini in config.yaml.
# Overrides the built-in conf/formats_sample.ini defaults.
#
# See docs/tagging_reference.md for the full variable and function reference.

[file-formatting]

nfo = %albumartist% - %album%.nfo
m3u = %albumartist% - %album%.m3u

# ── Directory naming ──────────────────────────────────────────────────────────
#
# Pattern:
#   Artist/[Year] Album (Edition) (CatNo) [FormatCode codec-quality-samplerate]
#
# Examples:
#   Clan of Xymox/[2004] Darkest Hour [CD flac-lossless-44s]
#   Stray/[2012] Holding On [DCD flac-lossless-44s]
#   The Young Gods/[2012] The Young Gods (Deluxe Edition) [DCD flac-lossless-44s]
#   Front 242/[1992] Masterhit [11xfile flac-lossless-44s]
#   Various Artists/[2001] Megahits 2001 Die Erste (560 938-2) [DCD flac-lossless-44s]
#
dir = $if1($strcmp('%albumartist%', 'Various'),'Various Artists','%albumartist%')/[%releasedate%] %album%$if1($strcmp('%edition%',''),'', ' \(%edition%\)')$if1($strcmp('%catno%',''),'', ' \(%catno%\)') [$if1($inarray('["File","Web"]','%format%'),'%trackcount%x','')%format_code% $lower('%codec%')-%quality%$if1($strcmp('%quality%','lossless'),$ifequal(%bitdepth%,24,'-24',''),'')-$substr('%samplerate%','','-3')$if1($strcmp('%channels%','stereo'),'s','%channels%')]

# ── Track naming ──────────────────────────────────────────────────────────────
#
# Single-artist:   01 Title.flac
# Various-artists: 01 Artist - Title.flac
#
song    = $num('%tracknumber%','2') $if1($strcmp('%artist%','%albumartist%'),'','%artist% - ')%title%%fileext%
va_song = $num('%tracknumber%','2') $if1($strcmp('%artist%','%albumartist%'),'','%artist% - ')%title%%fileext%

# ── Other ─────────────────────────────────────────────────────────────────────

image = image

# Disc subdirectory naming for multi-disc releases.
# The disc number is always appended by the code.
discs = $if1($strcmp('%totaldiscs%',''),'',$ifgreater('%totaldiscs%', 1, 'CD %discnumber%',''))$if1($strcmp('%disctitle%',''),'',', %disctitle%')
