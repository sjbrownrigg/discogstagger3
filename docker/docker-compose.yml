name: discogstagger3

services:
  discogstagger:
    build:
      context: https://github.com/sjbrownrigg/discogstagger3.git#master              # project root (local — switch to GitHub URL after merge)
      dockerfile: docker/Dockerfile
    image: discogstagger3:latest
    restart: unless-stopped
    volumes:
      - music:/music 
      - config:/config
      - cache:/cache 
    environment:
      TZ: Europe/London
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  cache:
    driver: local
